version: 2
updates:
  # Enable version updates for Python/pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group minor and patch updates together
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Security updates have higher priority
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    # Ignore major updates to litellm due to supply chain attack history
    ignore:
      - dependency-name: "litellm"
        update-types: ["version-update:semver-major"]
      # Explicitly block known-malicious litellm releases. These were minor/patch
      # bumps, so the semver-major rule above never covered them.
      #   1.82.7 / 1.82.8 - malicious versions (2024 supply chain attack)
      #   1.107.0           - malicious version (Oct 2026, credential stealer)
      - dependency-name: "litellm"
        versions: ["1.82.7", "1.82.8", "1.107.0"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "security"
    commit-message:
      prefix: "chore(ci)"
