[project]
name = "vtai"
version = "0.7.15"
description = " VT.ai - Minimal multimodal AI chat app with dynamic conversation routing "
authors = [{ name = "Vinh Nguyen" }]
dependencies = [
    "chainlit==2.12.0",
    "litellm==1.103.0",  # Exact pin: avoids malicious versions 1.82.7, 1.82.8 and 1.107.0 (supply chain attacks)
    "openai>=3.24.0",
    "pydantic>=2.13.5",  # Flexible version to resolve conflicts with litellm/chainlit
    "python-dotenv>=1.2.4",  # Flexible version to resolve conflicts
    "semantic-router[fastembed]==0.1.16",
    "google-generativeai==0.8.6",
    "tavily-python==0.8.4",
    "httpx==0.28.1",
    "aiohttp>=3.14.4",  # Security fix: Multiple CVEs (Dependabot #113-#124)
    "mcp>=1.30.0,<2.0.0",  # Security fix: GHSA-84m7-p3x7-pcfv (fixed in 1.30.0); chainlit caps mcp<2.0.0
    "cryptography>=50.0.2",  # Security fix: GHSA-r6ph-v2qm-q3c2 (buffer overflow)
    "PyJWT>=2.15.1",  # Security fix: GHSA-752w-5fwx-jx9f
]
readme = "README.md"
requires-python = ">= 3.11, < 3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

[project.urls]
"Homepage" = "https://github.com/vinhnx/VT.ai"
"Bug Tracker" = "https://github.com/vinhnx/VT.ai/issues"

[project.scripts]
vtai = "vtai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["vtai"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "twine==7.0.0",
    "ty>=0.0.84",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "twine==7.0.0",
    "black>=26.5.1",
    "isort==9.0.2",
    "flake8==7.4.1",
]

docs = ["mkdocs-llmstxt>=0.5.0"]

http2 = ["h2>=4.4.1", "httpx[http2]>=0.26.0"]

[tool.uv]
# Security overrides for transitive dependencies
override-dependencies = [
    "onnx>=1.21.0",  # Fix GHSA-q56x-g2fj-4rj6 (TOCTOU vulnerability)
    "pillow>=13.0.0",  # Fix Dependabot #125-#133 (heap overflow / OOB reads in Pillow)
    "python-multipart>=0.0.26",  # Fix Dependabot #28: DoS via large multipart preamble/epilogue
    "openai>=3.24.0",  # Override litellm pin
    "aiohttp>=3.14.4",  # Security fix: Multiple CVEs (override litellm pin) + Dependabot #113-#124
    "pydantic>=2.13.5",  # Override litellm pin
    "python-dotenv>=1.2.4",  # Override litellm pin
    "click>=8.3.3",  # Fix Dependabot #82: PYSEC-2026-2132 command injection in click.edit()
    "anyio>=4.14.2",  # Fix Dependabot #90-#91 (TLS cert spoofing / undrained stderr deadlock)
    "certifi>=2026.10.19",  # Fix Dependabot #119 (emSign root CAs with compromised intermediate keys)
    "fsspec>=2026.6.0",  # Fix Dependabot #116 (SSTI in ReferenceFileSystem -> RCE)
    "multidict>=6.9.1,<7.0",  # Fix Dependabot #117 (reference leak); aiohttp caps multidict<7.0
    "soupsieve>=2.9.0",  # Fix Dependabot #88-#89 (O(n^2) ReDoS in selector parsing)
    "tornado>=6.5.9",  # Fix Dependabot #85-#87, #108-#110 (DoS / cookie injection / path traversal)
    "urllib3>=2.8.0",  # Fix Dependabot #103-#105 (chunked-encoding DoS / proxy TLS bypass)
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "./vtai/utils/llm_providers_config.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.9
target-version = "0.7.11"

[tool.ruff.lint]
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = ["E4", "E7", "E9", "F", "B"]

# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]


# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ty.terminal]
error-on-warning = true
